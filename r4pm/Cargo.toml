[package]
name = "r4pm"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Process Mining CLI for working with (object-centric) event data"
homepage = "https://rust4pm.aarkue.eu"
repository = "https://github.com/aarkue/rust4pm"
rust-version = "1.89"

[dependencies]
process_mining = { version = "0.7.1", path = "../process_mining", features = ["bindings", "ocel-sqlite", "ocel-duckdb-bundled"] }
serde_json = "1.0.105"
serde = { version = "1.0.188", features = ["derive"] }
anstyle = "1.0.13"

